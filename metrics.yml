services:

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus_vol:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - metrics_net
    restart:
      on-failure
  
  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - '3000:3000'
    volumes:
      - grafana_vol:/var/lib/grafana
    networks:
      - metrics_net
    restart:
      on-failure

volumes:
  prometheus_vol:
  grafana_vol:

networks:
  metrics_net:
    driver: bridge