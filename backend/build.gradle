plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "4.4.1.3373"
	id 'jacoco'
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required.set(true)
        html.required.set(true)
        csv.required.set(false)
    }
}



group = 'itmo.devops'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
 	testImplementation 'org.mockito:mockito-core:4.3.1'
    testImplementation 'org.mockito:mockito-inline:4.3.1'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

sonarqube {
    properties {
		property "sonar.gradle.skipCompile", "true"
        property "sonar.projectKey", System.getenv("SONAR_PROJECT_KEY_BACKEND") ?: "NOTFOUND"
        property "sonar.host.url", System.getenv("SONAR_HOST_URL") ?: "NOTFOUND"
        property "sonar.token", System.getenv("SONAR_TOKEN") ?: "NOTFOUND"
		property "sonar.organization", System.getenv("SONAR_ORGANIZATION_KEY") ?: "NOTFOUND"
        property "sonar.java.binaries", "build/classes/java/main"
		property "sonar.coverage.jacoco.xmlReportPaths", "$buildDir/reports/jacoco/test/jacocoTestReport.xml"
		property "sonar.coverage.jacoco.htmlCoverageExtractionPath", "$buildDir/reports/jacoco/test/html/index.html"
		property "sonar.scm.disabled", "true"
    }
}

tasks.register('extractCoverage') {
    doLast {
        def filePath = "$buildDir/reports/jacoco/test/html/index.html"
        def file = file(filePath)

        if (!file.exists()) {
            println "HTML file not found at: $filePath"
            throw new GradleException("Coverage HTML file not found")
        }

        def html = file.text
        def matcher = html =~ /<td class="ctr2" id="c0">([^<]+)%<\/td>/

        if (matcher.find()) {
            def percentStr = matcher.group(1)
            def percent = percentStr.replace("%", "").toInteger()

            println "Extracted coverage: ${percent}%"

            if (percent < 80) {
                throw new GradleException("Coverage too low: ${percent}%. Must be at least 80%")
            }
        } else {
            println "Coverage value not found in HTML!"
            throw new GradleException("Could not extract coverage value from HTML")
        }
    }
}
